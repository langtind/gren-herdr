id = "gren"
name = "gren"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Create, switch, and remove git worktrees via gren — with gren's post-create setup"
platforms = ["macos", "linux"]

# Run gren's post-create setup whenever a worktree is born on herdr's side:
# the native "New worktree" dialog, the repo RIGHT-CLICK menu, or
# `herdr worktree create`. herdr emits worktree.created from the UI since #662.
[[events]]
on = "worktree.created"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/on-created.sh\""]

# Workspace action: opens the switch/create picker. Plugin panes default their
# cwd to the plugin root, so pass --cwd = the workspace's repo (from the injected
# context JSON); otherwise gren runs in the plugin dir.
#
# Opens as a session-modal popup on herdr >= 0.7.4, falling back to a split on
# <= 0.7.3, which errors with "invalid pane placement". Verified end to end that
# the modal does not fight what the picker does while it lives: the worktree is
# created, `worktree open --focus` switches workspace, and the setup pane opens
# focused with a live TTY (an interactive post-create hook still gets keystrokes).
[[actions]]
id = "open"
title = "Worktree: switch / create (gren)"
contexts = ["workspace"]
command = ["bash", "-c", "cwd=$(jq -r '.workspace_cwd // .focused_pane_cwd // empty' <<<\"$HERDR_PLUGIN_CONTEXT_JSON\"); \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint picker --placement popup --width 80% --height 60% --cwd \"$cwd\" --focus >/dev/null 2>&1 || exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint picker --placement split --direction down --cwd \"$cwd\" --focus"]

# Opens as a split, NOT a popup. Unlike the create picker — which you answer and
# dismiss in a second — removal runs `gren delete`, which can take a while
# (hooks, prune, large worktrees). A session-modal popup locks the whole session
# out for that duration; a split lets you keep working in other panes while the
# deletion runs.
[[actions]]
id = "remove"
title = "Worktree: remove (gren)"
contexts = ["workspace"]
command = ["bash", "-c", "cwd=$(jq -r '.workspace_cwd // .focused_pane_cwd // empty' <<<\"$HERDR_PLUGIN_CONTEXT_JSON\"); exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint remover --placement split --direction right --cwd \"$cwd\" --focus"]

# Runs the repo's gren post-create setup AS this pane's process, so it gets a
# real TTY (1Password op, make seed) without racing a shell's startup. The
# worktree.created event opens this into the new worktree's workspace.
[[panes]]
id = "bootstrap"
title = "gren setup"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bootstrap.sh\""]

[[panes]]
id = "picker"
title = "gren"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\""]

# Stays "split" deliberately, and the remove action passes the same placement
# explicitly: removal is long-running, so it must not hold a session-modal popup
# open while it works. Declaring popup HERE would also risk herdr <= 0.7.3
# rejecting the whole manifest — it errors with "invalid pane placement: popup",
# which takes the entire plugin down, not just the popup.
[[panes]]
id = "remover"
title = "gren — remove"
placement = "split"
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/remove.sh\""]
